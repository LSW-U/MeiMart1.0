name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        app: [client-app, rider-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # nodeLinker: hoisted 已迁入根 pnpm-workspace.yaml（批次2 G），无需 CLI flag
      - run: pnpm install --frozen-lockfile
      # 两个 app 的包名不是目录名（client=mei-mart-app / rider=mei-delivery-app），
      # matrix 用目录名便于阅读；-F 必须用包名——按目录名匹配不到时 pnpm 打印
      # "No projects matched" 但 exit 0（假绿），映射步骤必须放在所有 -F 步骤之前
      - name: Map app dir to package name
        id: pkg
        run: |
          if [ "${{ matrix.app }}" = "client-app" ]; then
            echo "name=mei-mart-app" >> "$GITHUB_OUTPUT"
          else
            echo "name=mei-delivery-app" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm -F ${{ steps.pkg.outputs.name }} typecheck
      - run: pnpm -F ${{ steps.pkg.outputs.name }} lint
      # 批次1 CI 修复：pnpm run script 的 `-- --ci` 在 CI 被当成位置参数（jest Pattern:
      # --ci -- 0 matches）→ exit 1。改用 exec 直跑 jest 绕开透传歧义
      # 第五轮 W1：覆盖率由两端 jest.config.js 的 collectCoverage: true 常开
      # （coverageThreshold 随采集在 CI 被评估；collectCoverageFrom 只定义范围不开启采集）
      - run: pnpm -F ${{ steps.pkg.outputs.name }} exec jest --ci
      # 前端接线切换 P1（20261002）：跨端批5 门禁挂接 CI（存量记账不拦截 / 新增拦截，
      # 语义见 scripts/gate/README.md；基线 json 与脚本本体不在本批改动范围）
      - run: |
          pnpm -F ${{ steps.pkg.outputs.name }} run check:gate-mock
          pnpm -F ${{ steps.pkg.outputs.name }} run check:gate-fake-green
          # 第四轮修复 P1-6：eas 发布前置校验（TODO- 占位/非法 URL 即 fail，D2 拍板）
          pnpm -F ${{ steps.pkg.outputs.name }} run check:release-config
      - if: matrix.app == 'client-app'
        run: |
          pnpm -F mei-mart-app check:i18n
          pnpm -F mei-mart-app check:a11y
          # 第四轮修复 P0-1：mock PII 扫描门禁（手机号/中文人名，双向验证 6 处精确命中）
          pnpm -F mei-mart-app run check:gate-pii
          # 数据层工程治理批3：icon symbol 映射门禁 + 死 i18n key 门禁
          # （Q6 语义：存量记账不拦截 / 新增拦截，基线见 scripts/gate/*-baseline.json）
          pnpm -F mei-mart-app run check:gate-icon
          pnpm -F mei-mart-app run check:gate-dead-key

  # 批次1 审查 P1-1 修复：原 job 不 install + 配置在 apps/client-app/ 子目录 +
  # PR 时校验 feature branch 多条中间 commit，三重失效。squash-merge 工作流下
  # 改为 push(master) 时校验刚落库的单条 squash commit；config-conventional
  # 是 client-app 的 devDep，必须 install 后用 pnpm -w exec 跑（npx 临时拉 cli
  # 解析不到 config 包）
  commitlint:
    runs-on: ubuntu-latest
    # 第四轮修复 E-P2-1：补 PR 触发——PR 时校验 PR 全部新增 commit（origin/master..HEAD），
    # squash-merge 后 push(master) 仍走 push 分支校验刚落库的单条 commit
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pick commitlint range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--from origin/${{ github.base_ref }} --to HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "args=--from HEAD~1 --to HEAD" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm -w exec commitlint ${{ steps.range.outputs.args }}

  # 第四轮修复 P1-5：packages/* 补 CI 覆盖（此前仅本地跑，5 包 test 带 --passWithNoTests 假绿风险）。
  # 沿用两端 job 的既有套路：目录名→包名映射（pnpm -F 按目录名匹配不到会打印
  # "No projects matched" 但 exit 0 假绿，:28-30 先例）+ exec jest --ci 直跑绕透传歧义（:40-42 先例）
  packages:
    strategy:
      fail-fast: false
      matrix:
        package: [api-core, format, i18n-core, nav-core, upload-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Map package dir to package name
        id: pkg
        run: echo "name=@meimart/${{ matrix.package }}" >> "$GITHUB_OUTPUT"
      - run: pnpm -F ${{ steps.pkg.outputs.name }} typecheck
      - run: pnpm -F ${{ steps.pkg.outputs.name }} exec jest --ci

  # 安全专项收尾 P2-2：依赖审计门禁。pnpm audit（high 及以上）存量 advisory 记账在
  # scripts/gate/audit-allowlist.json（逐条带理由，均为 Expo 工具链开发/构建期传递依赖，
  # 不进 App 包）；记账之外的 advisory 直接 fail（新增不拦截 = 假绿）。
  # 维护规则：上游消减后先删 entry 再实跑 pnpm audit 验证；allowlist 格式对齐 scripts/gate 基线。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency Audit (high+ with allowlist)
        run: |
          # audit 跑 moderate 级（allowlist 记账覆盖全部 21 条含 moderate），
          # 拦截语义由 allowlist 决定而非级别
          pnpm audit --audit-level=moderate --json > /tmp/audit.json || true
          node scripts/gate/audit-check.mjs /tmp/audit.json scripts/gate/audit-allowlist.json

  # 轻量化省流批3（方案v2 D3/D5）：包体积预算门禁。JS bundle（hbc）超 8.7MB
  # （基线 8.5MB 实测 20261024 + 200KB 余量）即红；口径只管 JS bundle，
  # 字体/静态资产不在内。红/绿双向演示证据见审查记录（BUDGET_BYTES 降阈值 → exit 1）。
  size-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle size budget (hbc vs 8.7MB)
        run: node scripts/budget-check.mjs
